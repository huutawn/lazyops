apiVersion: v1
kind: Namespace
metadata:
  name: lazyops-day9-day10
  labels:
    app.kubernetes.io/part-of: lazyops
    lazyops.platform/day-pack: day9-day10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-smoke
  namespace: lazyops-day9-day10
  labels:
    app.kubernetes.io/name: public-smoke
    lazyops.service: public-smoke
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-smoke
        lazyops.service: public-smoke
    spec:
      containers:
        - name: public-smoke
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: public-smoke
  namespace: lazyops-day9-day10
spec:
  selector:
    app.kubernetes.io/name: public-smoke
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-smoke
  namespace: lazyops-day9-day10
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: public-smoke.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public-smoke
                port:
                  number: 80
