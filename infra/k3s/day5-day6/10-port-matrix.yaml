---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-postgres
  namespace: lazyops-day5-day6
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-postgres
        lazyops.matrix/profile: postgres
    spec:
      containers:
        - name: matrix-postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: lazyops
            - name: POSTGRES_DB
              value: lazyops
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-postgres
  namespace: lazyops-day5-day6
spec:
  selector:
    app.kubernetes.io/name: matrix-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-multiport
  namespace: lazyops-day5-day6
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-multiport
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-multiport
        lazyops.matrix/profile: multi-port
    spec:
      containers:
        - name: matrix-multiport
          image: mendhak/http-https-echo:31
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-multiport
  namespace: lazyops-day5-day6
spec:
  selector:
    app.kubernetes.io/name: matrix-multiport
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
