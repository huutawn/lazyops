apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-nginx
  namespace: lazyops-day5-day6
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-nginx
        lazyops.matrix/profile: nginx
    spec:
      containers:
        - name: matrix-nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-nginx
  namespace: lazyops-day5-day6
spec:
  selector:
    app.kubernetes.io/name: matrix-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-next
  namespace: lazyops-day5-day6
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-next
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-next
        lazyops.matrix/profile: next
    spec:
      containers:
        - name: matrix-next
          image: node:20-alpine
          command:
            - sh
            - -c
            - node -e "require('http').createServer((req,res)=>res.end('next-like')).listen(3000,'0.0.0.0')"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-next
  namespace: lazyops-day5-day6
spec:
  selector:
    app.kubernetes.io/name: matrix-next
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
