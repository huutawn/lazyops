apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-smoke
  namespace: lazyops-smoke
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-smoke
  namespace: lazyops-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pvc-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvc-smoke
    spec:
      containers:
        - name: pvc-smoke
          image: busybox:1.36
          command: ["sh", "-c", "echo smoke > /data/ready.txt && sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-smoke
