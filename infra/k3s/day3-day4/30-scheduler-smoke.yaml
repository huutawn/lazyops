apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-smoke
  namespace: lazyops-smoke
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler-smoke
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: scheduler-smoke
      containers:
        - name: scheduler-smoke
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
