apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-smoke
  namespace: lazyops-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-smoke
    spec:
      imagePullSecrets:
        - name: lazyops-registry
      containers:
        - name: registry-smoke
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
