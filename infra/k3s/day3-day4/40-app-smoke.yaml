apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-smoke
  namespace: lazyops-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-smoke
    spec:
      containers:
        - name: app-smoke
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: app-smoke-env
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app-smoke
  namespace: lazyops-smoke
spec:
  selector:
    app.kubernetes.io/name: app-smoke
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-smoke
  namespace: lazyops-smoke
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: app-smoke.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-smoke
                port:
                  number: 80
