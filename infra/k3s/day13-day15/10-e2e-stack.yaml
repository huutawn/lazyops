apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: lazyops-day13-day15
type: Opaque
stringData:
  POSTGRES_DB: app
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: lazyops-day13-day15
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
      }

      location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        return 200 'lazyops-web-ok';
        add_header Content-Type text/plain;
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: lazyops-day13-day15
  labels:
    app.kubernetes.io/name: db-service
    lazyops.project_id: prj-e2e
    lazyops.revision_id: rev-e2e
    lazyops.service: db-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-service
  namespace: lazyops-day13-day15
  labels:
    app.kubernetes.io/name: db-service
    lazyops.project_id: prj-e2e
    lazyops.revision_id: rev-e2e
    lazyops.service: db-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-service
        lazyops.project_id: prj-e2e
        lazyops.revision_id: rev-e2e
        lazyops.service: db-service
    spec:
      containers:
        - name: db-service
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: db-credentials
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: lazyops-day13-day15
  labels:
    app.kubernetes.io/name: db-service
    lazyops.project_id: prj-e2e
    lazyops.revision_id: rev-e2e
    lazyops.service: db-service
spec:
  selector:
    app.kubernetes.io/name: db-service
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lazyops-day13-day15
  labels:
    app.kubernetes.io/name: api
    lazyops.project_id: prj-e2e
    lazyops.revision_id: rev-e2e
    lazyops.service: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        lazyops.project_id: prj-e2e
        lazyops.revision_id: rev-e2e
        lazyops.service: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: db-service
            - name: DATABASE_URL
              value: postgres://app:app-secret@db-service:5432/app
          command:
            - /bin/sh
            - -c
            - |
              until nc -z db-service 5432; do
                echo "waiting for db-service";
                sleep 2;
              done
              mkdir -p /www
              while true; do
                printf '{"status":"ok","service":"api","db_host":"%s","database_url":"%s"}\n' "$DB_HOST" "$DATABASE_URL" > /www/index.html
                sleep 5
              done &
              httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lazyops-day13-day15
  labels:
    app.kubernetes.io/name: api
    lazyops.project_id: prj-e2e
    lazyops.revision_id: rev-e2e
    lazyops.service: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lazyops-day13-day15
  labels:
    app.kubernetes.io/name: web
    lazyops.project_id: prj-e2e
    lazyops.revision_id: rev-e2e
    lazyops.service: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        lazyops.project_id: prj-e2e
        lazyops.revision_id: rev-e2e
        lazyops.service: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: web-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: web-nginx
          configMap:
            name: web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lazyops-day13-day15
  labels:
    app.kubernetes.io/name: web
    lazyops.project_id: prj-e2e
    lazyops.revision_id: rev-e2e
    lazyops.service: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: lazyops-day13-day15
  annotations:
    kubernetes.io/ingress.class: traefik
  labels:
    app.kubernetes.io/name: web
    lazyops.project_id: prj-e2e
    lazyops.revision_id: rev-e2e
    lazyops.service: web
spec:
  ingressClassName: traefik
  rules:
    - host: lazyops-e2e.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
