apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    logs:
      general:
        level: INFO
      access:
        enabled: true
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true
    additionalArguments:
      - "--entryPoints.web.forwardedHeaders.insecure=true"
      - "--serversTransport.insecureSkipVerify=true"
