apiVersion: v1
kind: Secret
metadata:
  name: lazyops-node-agent-env
  namespace: lazyops-system
type: Opaque
stringData:
  AGENT_NAME: "lazyops-k3s-node-agent"
  AGENT_RUNTIME_MODE: "distributed-k3s"
  AGENT_AGENT_KIND: "node_agent"
  AGENT_TARGET_REF: "prod-k3s"
  BACKEND_WS_URL: "wss://lazyops.example.com/api/v1/ws/agents/control"
  AGENT_TOKEN: "replace-me"
