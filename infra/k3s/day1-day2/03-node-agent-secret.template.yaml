apiVersion: v1
kind: Secret
metadata:
  name: lazyops-node-agent-env
  namespace: lazyops-system
type: Opaque
stringData:
  AGENT_APP_NAME: "lazyops-k3s-node-agent"
  AGENT_APP_ENV: "production"
  AGENT_RUNTIME_MODE: "distributed-k3s"
  AGENT_KIND: "node_agent"
  AGENT_TARGET_REF: "prod-k3s"
  AGENT_CONTROL_PLANE_URL: "wss://lazyops.example.com/api/v1/ws/agents/control"
  AGENT_BOOTSTRAP_TOKEN: "replace-me"
  AGENT_STATE_ENCRYPTION_KEY: "replace-me"
  AGENT_STATE_DIR: "/var/lib/lazyops-agent"
  AGENT_RUNTIME_ROOT_DIR: "/var/lib/lazyops-agent/runtime"
