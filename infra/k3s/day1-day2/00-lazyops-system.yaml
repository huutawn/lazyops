apiVersion: v1
kind: Namespace
metadata:
  name: lazyops-system
  labels:
    app.kubernetes.io/part-of: lazyops
    app.kubernetes.io/managed-by: lazyops
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lazyops-defaults
  namespace: lazyops-system
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lazyops-system-quota
  namespace: lazyops-system
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "20"
