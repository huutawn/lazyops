apiVersion: v1
kind: Secret
metadata:
  name: lazyops-namespace-agent-kubeconfig
  namespace: lazyops-day7-day8
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: lazyops-k3s
        cluster:
          server: https://REPLACE_WITH_K3S_API_SERVER
          certificate-authority-data: REPLACE_WITH_BASE64_CA
    contexts:
      - name: lazyops-namespace-agent
        context:
          cluster: lazyops-k3s
          namespace: lazyops-day7-day8
          user: lazyops-namespace-agent
    current-context: lazyops-namespace-agent
    users:
      - name: lazyops-namespace-agent
        user:
          token: REPLACE_WITH_SERVICE_ACCOUNT_TOKEN
