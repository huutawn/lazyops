apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-service
  namespace: lazyops-day7-day8
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-service
    spec:
      containers:
        - name: db-service
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: lazyops
            - name: POSTGRES_PASSWORD
              value: lazyops
            - name: POSTGRES_DB
              value: lazyops
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: lazyops-day7-day8
spec:
  selector:
    app.kubernetes.io/name: db-service
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dns-smoke
  namespace: lazyops-day7-day8
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-smoke
    spec:
      restartPolicy: Never
      containers:
        - name: dns-smoke
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              nslookup db-service
              nslookup db-service.lazyops-day7-day8.svc.cluster.local
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-smoke
  namespace: lazyops-day7-day8
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-smoke
    spec:
      restartPolicy: Never
      containers:
        - name: pg-smoke
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              value: lazyops
          command:
            - sh
            - -c
            - |
              until pg_isready -h db-service -p 5432 -U lazyops -d lazyops; do
                sleep 2
              done
