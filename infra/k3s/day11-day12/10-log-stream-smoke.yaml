apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-log-smoke
  namespace: lazyops-day11-day12
  labels:
    app.kubernetes.io/name: live-log-smoke
    lazyops.project_id: prj-day11-day12
    lazyops.revision_id: rev-log-smoke
    lazyops.service: live-log-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: live-log-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-log-smoke
        lazyops.project_id: prj-day11-day12
        lazyops.revision_id: rev-log-smoke
        lazyops.service: live-log-smoke
    spec:
      containers:
        - name: live-log-smoke
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              i=0
              while true; do
                echo "live-log-smoke tick=${i}"
                i=$((i+1))
                sleep 1
              done
---
apiVersion: v1
kind: Service
metadata:
  name: live-log-smoke
  namespace: lazyops-day11-day12
  labels:
    app.kubernetes.io/name: live-log-smoke
    lazyops.project_id: prj-day11-day12
    lazyops.revision_id: rev-log-smoke
    lazyops.service: live-log-smoke
spec:
  selector:
    app.kubernetes.io/name: live-log-smoke
  ports:
    - name: http
      port: 8080
      targetPort: 8080
